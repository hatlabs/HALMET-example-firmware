; PlatformIO Project Configuration File
;
; HALMET example firmware -- tank, tacho and alarm inputs to Signal K and
; NMEA 2000.

[platformio]

; halmet_espidf builds ESP-IDF from source so sdkconfig.defaults is
; authoritative (CONFIG_MBEDTLS_DYNAMIC_BUFFER) -- required for a stable TLS
; Signal K connection. The plain `halmet` env (arduino, precompiled libs)
; ignores sdkconfig and fails TLS at runtime with MBEDTLS_ERR_SSL_ALLOC_FAILED
; (SSL is compiled in either way); use it only for fast compile checks when a
; working TLS Signal K connection isn't needed (`pio run -e halmet`).
default_envs = halmet_espidf

[env]

upload_speed = 2000000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.5.0
    adafruit/Adafruit SSD1306 @ ^2.5.1
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    adafruit/Adafruit ADS1X15 @ ^2.3.0

build_flags =
    ; Max (and default) debugging level in Arduino ESP32 Core
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG

; HALMET has 8 MB+ flash; default_8MB gives two app partitions for OTA. The
; from-source espidf build validates the table against the flash size, so it
; must be declared explicitly -- the esp32dev board manifest defaults to 4 MB.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

;; Uncomment the following lines to use Over-the-air (OTA) Updates
;upload_protocol = espota
;upload_port = IP_ADDRESS_OF_ESP_HERE
;upload_flags =
;  --auth=YOUR_OTA_PASSWORD

; You shouldn't need to touch the settings in this section below this line.

build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder

test_build_src = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Platform configurations follow

[pioarduino]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
    ; Enable SSL/TLS support for Signal K server connections
    -D SENSESP_SSL_SUPPORT=1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Board configurations follow

[esp32]

board = esp32dev
build_flags =
    ${env.build_flags}
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Individual board configurations

; Arduino-only build with the precompiled framework libraries. Fast compile
; check; not the build to flash (see the [platformio] comment above).
[env:halmet]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}
lib_deps =
    ${env.lib_deps}
    ; SensESP includes <esp_websocket_client.h> unconditionally and the
    ; precompiled arduino framework bundles no copy, so this env fetches the
    ; component from the registry. halmet_espidf takes it from
    ; src/idf_component.yml instead.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip

; espidf+arduino dual-framework build. Building ESP-IDF from source makes
; sdkconfig authoritative, enabling CONFIG_MBEDTLS_DYNAMIC_BUFFER -- the dynamic
; TLS buffer that keeps the Signal K TLS connection stable. Impossible with the
; precompiled arduino libs the halmet env uses.
[env:halmet_espidf]

extends = env:halmet
framework = espidf, arduino
; Same as env:halmet minus esp_websocket_client, which this env takes from
; src/idf_component.yml (pinned in dependencies.lock).
lib_deps =
    ${env.lib_deps}
; esp_insights and esp_rainmaker are pulled in transitively by arduino-esp32 on
; the esp32 and require their server certs embedded, even though this firmware
; uses neither cloud service.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
